name: CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Incrementar version y subir con PAT
        env:
          PAT: ${{ secrets.PAT_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          current_ver=$(grep -oE "AppVersion-[0-9]+" README.md | tail -1 | cut -d'-' -f2 || echo "0")
          next_ver=$((current_ver + 1))
          now=$(date "+%Y-%m-%d %H:%M:%S")
          echo "AppVersion-$next_ver ($now)" >> README.md
          git add README.md
          git commit -m "chore: bump version en README [skip ci]" || echo "Sin cambios"
          git push https://x-access-token:${PAT}@github.com/FelixRG1/proyectoGitAvanzado.git main

  validate-prod:
    needs: update-readme
    runs-on: self-hosted
    steps:
      - name: Comparar PROD_TOKEN con variable local
        env:
          TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          if ($env:TOKEN -eq $env:LOCAL_PROD_TOKEN) {
            Write-Host "Coinciden PROD_TOKEN"
          } else {
            Write-Host "No coinciden PROD_TOKEN"
            exit 1
          }
EOF
